# Optional proxy. Set use_proxy to true or false.
proxy:
  use_proxy: true
  proxy_list:
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=


# ===================== RUN MATRIX ======================================
# Toggle devices and frameworks on/off per run.
run_matrix:
  devices:
    cpu: true
    gpu: true
    npu: true

  cpu:
    llamacpp_ggml_cpu: true
    llamacpp_ov_cpu: true
    ov_genai_ir_cpu: true
  gpu:
    llamacpp_vulkan_gpu: true
    llamacpp_ov_gpu: true
    ov_genai_ir_gpu: true
  npu:
    llamacpp_ov_npu: true
    ov_genai_ir_npu: true


# ========================= DIRECTORIES =================================
build_dir: ./BUILD
gguf_dir: ./MODELS/gguf
ir_dir: ./MODELS/ir
results_dir: ./RESULTS
logs_dir: ./logs
llamacpp_ov_dir: /opt/intel/openvino


# ================= OPENVINO CONFIGURATION FOR LLAMACPP (BUILD MODE)=================
openvino:
  # version: default/latest
  version: default
  default_url: https://storage.openvinotoolkit.org/repositories/openvino/packages/2026.1/linux/openvino_toolkit_ubuntu24_2026.1.0.21367.63e31528c62_x86_64.tgz


# ======================== LLAMACPP CONFIGURATION =======================
llamacpp:

  # select llama.cpp source build mode: build | release
  # release mode downloads latest ubuntu-x64 CPU/Vulkan/OpenVINO artifacts from ggml-org/llama.cpp releases
  use: build

  
  quantizations: [Q4_0, Q4_K_M]
  
  bench:
    # Number of repetitions for each benchmark test (applies to CPU/GPU/NPU) (-r)
    repetitions: 1
    # llama-bench prompt phase tokens (CPU/GPU) (-p)
    pp_tokens: 128
    # llama-bench token generation tokens (CPU/GPU) (-n)
    tg_tokens: 32
    # GPU computational depth (-d)
    gpu_depth: 0
    # Layers to offload from system RAM to GPU VRAM (-ngl)
    n_gpu_layers: 99
    # llama-bench prompt phase tokens (NPU) (-p)
    npu_pp_tokens: 64
    # llama-bench token generation tokens (NPU) (-n)
    npu_tg_tokens: 16
  
  perplexity:
    # Context size for llama-perplexity (-c)
    ctx: 512
    # Batch size for perplexity calculations (-b)
    batch: 512
  
  cli_smoke:
    # Non-interactive prompt used by llama-cli smoke test.
    prompt: "Reply with exactly: SMOKE_OK"
    # If set, llama-cli output must contain this substring (case-insensitive).
    expect_text: "SMOKE_OK"
    # Also require at least some generated text in output.
    require_nonempty: true
  
  runtime_env:
    cpu:
      GGML_OPENVINO_DEVICE: CPU
      GGML_OPENVINO_STATEFUL_EXECUTION: "1"
      # GGML_OPENVINO_CACHE_DIR: /tmp/ov_cpu_cache
    gpu:
      GGML_OPENVINO_DEVICE: GPU
      GGML_OPENVINO_STATEFUL_EXECUTION: "1"
      #GGML_OPENVINO_CACHE_DIR: /tmp/ov_gpu_cache
    npu:
      GGML_OPENVINO_DEVICE: NPU
      #GGML_OPENVINO_CACHE_DIR: /tmp/ov_npu_cache


# =================== GENAI BENCHMARK.PY CONFIGURATION ==================
genai:
  benchmark:
    # "Prompt" size for the inference test (-ic)
    initial_content_length: 128
    # Number of benchmark runs (-n)
    iterations: 1
    # Input prompt file for inference (-pf)
    prompt_file: ./prompt.jsonl
    # Input prompt, e.g. "Hi! List first 10 primes.". Takes precedence over prompt_file if set (-p).
    prompt: "Who are you?"
    # Batch size for GPU runs (-mc)
    max_context: 1


# ========================= MODELS CONFIGURATION =========================
# models can be added manually to working directory path: ./STORE/models/...
