ir_models:
  # Optional per-device export flags for: optimum-cli export openvino
  # These control GPU/NPU specific CLI quantization parameters.
  # Leave respective value empty if any flag is not needed.
  params:
    gpu:
      weight_format: int4
      group_size: 32
      ratio: 1.0
      sym:  
      trust_remote_code: true
    npu:
      weight_format: int4
      group_size: -1
      ratio: 1.0
      sym: true
      trust_remote_code: true

  # Gated models require HF token, to fix those:
  # 1. Accept the license on HuggingFace on model page
  # 2. Generate an HF token: https://huggingface.co/settings/tokens
  # 3. Login before running the script using "hf auth login"
  # Or set the token as an environment variable:
  # $ export HF_TOKEN=your_token_here
  # $ bash ovir_downloader.sh
  # Or set the token in ir_models.hf_token field
  hf_token: 
  models:
    - meta-llama/Llama-3.2-1B-Instruct
    - meta-llama/Llama-3.1-8B-Instruct
    - microsoft/Phi-3-mini-4k-instruct
    - Qwen/Qwen2.5-1.5B-Instruct
    - Qwen/Qwen3-8B
    - openbmb/MiniCPM-S-1B-sft
    - tencent/Hunyuan-7B-Instruct
    - mistralai/Mistral-7B-Instruct-v0.3
    - deepseek-ai/DeepSeek-R1-Distill-Llama-8B
